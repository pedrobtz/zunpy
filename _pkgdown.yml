url: https://pedrobtz.github.io/zunpy/
template:
  bootstrap: 5

# A release version (0.1.0) builds the site at the root; a development
# version (0.1.0.9000) builds it into dev/, leaving the released docs at the
# root. The deploy step keeps both (clean: false in pkgdown.yaml).
development:
  mode: auto

reference:
  - title: Reading
    contents:
      - npy_decode
      - npy_header
  - title: About
    contents:
      - zunpy_info
  - title: Conditions
    contents:
      - zunpy-conditions
