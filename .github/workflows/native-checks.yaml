# The package under UBSan, ASan, valgrind, LTO, gctorture and a blocking
# rchk (roadmap Stage 2). Quick on each push to a pull request, full after
# merge; the full-ci label runs the full set on a pull request.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Weekly, so a latent problem surfaces without waiting for a push.
    - cron: "56 12 * * 0"
  workflow_dispatch:

name: native-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0

  # ZUNPY_SKIP_HEAVY skips the large-input cases: they test values, not
  # PROTECT discipline, and under gctorture they would take hours.
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@30da3a640992fe6d502c578a12c0f2f3aed282c1 # v1.26.0
    with:
      profile: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
      timeout-minutes: 240
      env: |
        ZUNPY_SKIP_HEAVY=true

  # Blocking from the first run: the C code is new, so any finding is ours.
  # zubin and zufast (LinkingTo) come from CRAN, as the rchk image installs.
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      fail-on-findings: true

  # Roadmap Stage 7: the whole suite with the memcpy fast path compiled out,
  # so that a little-endian runner takes the element-by-element path a
  # big-endian host would. zunpy_info()$fast_path proves the flag took.
  forced-big-endian:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUNPY_FORCED_BE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr, any::bit64, any::pkgload
      - name: Test with -DZNP_FORCE_BE_HOST
        run: |
          mkdir -p ~/.R
          echo "CPPFLAGS += -DZNP_FORCE_BE_HOST" >> ~/.R/Makevars
          Rscript -e 'pkgload::load_all(); stopifnot(!zunpy_info()$fast_path); testthat::test_local(stop_on_failure = TRUE)'
