on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "46 12 * * 0"
  workflow_dispatch:
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@ae59a2805e622e9ba0f3e902bc5f39eba33c6670 # v1.45.1
    permissions:
      contents: write
